<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="遺言書と万年筆、観葉植物の机上のイメージ">
  <rect width="1600" height="1200" fill="#F3E6D3"/>
  <rect y="760" width="1600" height="440" fill="#E4CBA8"/>
  <circle cx="1280" cy="330" r="210" fill="#F9F0E3"/>
  <!-- window light -->
  <rect x="140" y="110" width="360" height="460" rx="12" fill="#FBF5EA"/>
  <path d="M320 110v460M140 340h360" stroke="#E4CBA8" stroke-width="10"/>
  <!-- house charm -->
  <g transform="translate(1060 470)">
    <path d="M0 130 L170 0 L340 130 V300 H0Z" fill="#D9743A"/>
    <rect x="135" y="170" width="70" height="130" rx="8" fill="#F9F0E3"/>
    <rect x="40" y="150" width="60" height="60" rx="6" fill="#F9F0E3"/>
    <rect x="240" y="150" width="60" height="60" rx="6" fill="#F9F0E3"/>
  </g>
  <!-- paper -->
  <g transform="rotate(-4 700 760)">
    <rect x="360" y="420" width="640" height="560" rx="14" fill="#000" opacity=".08" transform="translate(14 18)"/>
    <rect x="360" y="420" width="640" height="560" rx="14" fill="#FFFDF8"/>
    <rect x="430" y="480" width="300" height="26" rx="13" fill="#D9743A"/>
    <g fill="#E6DCCB">
      <rect x="430" y="560" width="500" height="16" rx="8"/>
      <rect x="430" y="610" width="460" height="16" rx="8"/>
      <rect x="430" y="660" width="500" height="16" rx="8"/>
      <rect x="430" y="710" width="400" height="16" rx="8"/>
      <rect x="430" y="760" width="480" height="16" rx="8"/>
    </g>
    <path d="M700 890c30-50 60-10 80-40s40 20 70-10" fill="none" stroke="#3F5B4E" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- pen -->
  <g transform="rotate(32 1000 900)">
    <rect x="880" y="880" width="360" height="34" rx="17" fill="#3F5B4E"/>
    <path d="M880 880l-70 17 70 17z" fill="#C9A24B"/>
    <rect x="1130" y="880" width="14" height="34" fill="#C9A24B"/>
  </g>
  <!-- plant -->
  <g transform="translate(160 680)">
    <path d="M70 230h140l-18 160H88z" fill="#D9743A"/>
    <path d="M140 230C100 160 70 120 60 60c50 20 80 80 80 170z" fill="#5E8A6F"/>
    <path d="M140 230c10-80 40-130 100-160-10 70-40 130-100 160z" fill="#3F5B4E"/>
    <path d="M140 230c-20-60-10-110 30-150 20 60 10 110-30 150z" fill="#7FA68A"/>
  </g>
</svg>
